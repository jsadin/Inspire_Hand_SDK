# launch 未指定 --device-config 时的占位配置。日常启动请按机型选用 device_protocol_*_example.yaml。
protocol:
  type: RH56H1_canfd

devices:
  - name: hand_left
    port: /dev/ttyUSB0
    baudrate: 115200
    Hand_ID: 1

logging:
  level: INFO
  file: logs/hand_control.log
  console: true
  file_enable: true
  max_file_size_mb: 10
  max_files: 5
