# 仓库默认设备配置（当前机型：RH56H1 CAN-FD）。
# launch 未指定 --device-config 时加载本文件；换机型请用对应 device_protocol_*_example.yaml，不要覆盖本文件当新产品配置。
protocol:
  type: RH56H1_canfd

devices:
  - name: hand_left
    port: /dev/ttyUSB0
    baudrate: 115200
    Hand_ID: 1

logging:
  level: INFO
  file: logs/hand_control.log
  console: true
  file_enable: true
  max_file_size_mb: 10
  max_files: 5
